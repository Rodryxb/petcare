{% load static %}
<!DOCTYPE html>
<html lang="es-CL" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página no encontrada (404) | PetCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="{% static 'css/petcare-dark.css' %}" rel="stylesheet" />
</head>
<body class="d-flex align-items-center justify-content-center p-3" style="min-height: 100vh; background-color: var(--pc-bg-main);">
  <div class="pc-card p-4 p-md-5 text-center" style="max-width: 520px; width: 100%; border-color: rgba(6, 182, 212, 0.45); box-shadow: 0 0 35px -5px var(--pc-cyan-glow);">
    <div class="pc-brand-icon mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem; background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.5); color: #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);">
      <i class="bi bi-compass"></i>
    </div>

    <span class="badge text-bg-dark border border-secondary-subtle px-3 py-2 text-info font-monospace mb-3">ERROR 404</span>

    <h1 class="h4 fw-bold text-white mb-2">Ruta Clínica No Encontrada</h1>
    <p class="text-secondary small mb-4">
      La dirección <code class="text-info font-monospace">{{ request_path|default:request.path }}</code> no corresponde a ningún módulo activo de PetCare.
    </p>

    <!-- Alerta visual con cuenta regresiva -->
    <div class="alert alert-dark border-secondary-subtle py-2 px-3 small d-flex align-items-center justify-content-center gap-2 mb-4 text-secondary">
      <i class="bi bi-arrow-repeat text-info spin"></i>
      <span>Redirigiendo automáticamente al panel principal en <strong id="contador-segundos" class="text-white">6</strong> segundos...</span>
    </div>

    <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
      <a href="{% url 'dashboard' %}" class="btn btn-pc-cyan px-4 py-2 d-inline-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-house-door-fill"></i>
        <span>Ir al Panel Principal</span>
      </a>
      <button type="button" class="btn btn-outline-secondary px-3 py-2" onclick="history.back()">
        <i class="bi bi-arrow-left me-1"></i>Volver atrás
      </button>
    </div>
  </div>

  <script>
    let segundos = 6;
    const contadorEl = document.getElementById("contador-segundos");
    const interval = setInterval(() => {
      segundos--;
      if (contadorEl) contadorEl.textContent = segundos;
      if (segundos <= 0) {
        clearInterval(interval);
        window.location.href = "{% url 'dashboard' %}";
      }
    }, 1000);
  </script>
</body>
</html>
