{% load static %}
<!DOCTYPE html>
<html lang="es-CL" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar Sesión | PetCare</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="{% static 'css/petcare-dark.css' %}" rel="stylesheet" />
</head>
<body class="d-flex align-items-center justify-content-center p-3" style="min-height: 100vh;">
  <div class="pc-card p-4 p-md-5" style="max-width: 440px; width: 100%; border-color: rgba(6, 182, 212, 0.35);">
    <div class="text-center mb-4">
      <div class="pc-brand-icon mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.65rem;">
        <i class="bi bi-heart-pulse-fill"></i>
      </div>
      <h1 class="h4 fw-bold text-white mb-1">Pet<span style="color: var(--pc-cyan);">Care</span> Clínico</h1>
      <p class="text-secondary small mb-0">Acceso exclusivo para personal autorizado</p>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger border-danger-subtle py-2 small d-flex align-items-center gap-2">
      <i class="bi bi-exclamation-octagon-fill"></i>
      <span>Credenciales inválidas. Verifique su usuario y contraseña.</span>
    </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}" novalidate>
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}" />{% endif %}

      <div class="mb-3">
        <label for="id_username" class="form-label small text-secondary fw-semibold">Usuario</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary-subtle text-info"><i class="bi bi-person-badge"></i></span>
          <input type="text" name="username" id="id_username" class="form-control" placeholder="Ej: dra.morales" required autofocus />
        </div>
      </div>

      <div class="mb-4">
        <label for="id_password" class="form-label small text-secondary fw-semibold">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary-subtle text-info"><i class="bi bi-key"></i></span>
          <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••••" required />
        </div>
      </div>

      <button type="submit" class="btn btn-pc-cyan w-100 py-2 d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-shield-lock-fill"></i>
        <span>Ingresar al Sistema</span>
      </button>
    </form>

    <hr class="border-secondary-subtle my-4" />

    <div class="small text-secondary">
      <div class="fw-semibold text-light mb-2 d-flex align-items-center gap-1">
        <i class="bi bi-lightning-charge-fill text-info"></i>
        <span>Acceso rápido de revisión docente:</span>
      </div>
      <div class="d-grid gap-2">
        <button type="button" class="btn btn-sm btn-outline-secondary text-start d-flex justify-content-between align-items-center" onclick="completarDemo('admin', 'PetCare2026!')">
          <span><i class="bi bi-person-gear text-info me-1"></i> <strong>admin</strong></span>
          <span class="pc-role-badge">Administrador</span>
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary text-start d-flex justify-content-between align-items-center" onclick="completarDemo('dra.morales', 'PetCare2026!')">
          <span><i class="bi bi-capsule text-success me-1"></i> <strong>dra.morales</strong></span>
          <span class="pc-role-badge">Veterinario</span>
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary text-start d-flex justify-content-between align-items-center" onclick="completarDemo('recepcion', 'PetCare2026!')">
          <span><i class="bi bi-headset text-warning me-1"></i> <strong>recepcion</strong></span>
          <span class="pc-role-badge">Recepcionista</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    function completarDemo(usuario, clave) {
      document.getElementById("id_username").value = usuario;
      document.getElementById("id_password").value = clave;
    }
  </script>
</body>
</html>
